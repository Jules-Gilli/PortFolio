<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background radial gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2d1b4e" />
      <stop offset="60%" stop-color="#160d2e" />
      <stop offset="100%" stop-color="#0a0613" />
    </radialGradient>

    <!-- Title gradient (purple → pink) -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Accent dot gradient -->
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>

    <!-- Soft glow filter for the title -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Decorative glows -->
  <circle cx="180" cy="120" r="220" fill="url(#dotGlow)" opacity="0.7"/>
  <circle cx="1050" cy="540" r="260" fill="url(#dotGlow)" opacity="0.5"/>

  <!-- Subtle dot pattern -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="100" cy="100" r="2"/>
    <circle cx="200" cy="100" r="2"/>
    <circle cx="300" cy="100" r="2"/>
    <circle cx="100" cy="200" r="2"/>
    <circle cx="200" cy="200" r="2"/>
    <circle cx="900" cy="500" r="2"/>
    <circle cx="1000" cy="500" r="2"/>
    <circle cx="1100" cy="500" r="2"/>
    <circle cx="900" cy="400" r="2"/>
    <circle cx="1000" cy="400" r="2"/>
  </g>

  <!-- Top-left brand badge -->
  <g transform="translate(80, 80)">
    <rect width="180" height="44" rx="22" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.35)" stroke-width="1"/>
    <circle cx="22" cy="22" r="5" fill="#a78bfa"/>
    <text x="40" y="29" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#e9d5ff" letter-spacing="0.5">
      JulesGilli.com
    </text>
  </g>

  <!-- Main title -->
  <text x="600" y="290" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="120" font-weight="800"
        fill="url(#titleGrad)"
        filter="url(#softGlow)"
        letter-spacing="-2">
    Jules Gilli
  </text>

  <!-- Subtitle -->
  <text x="600" y="360" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="32" font-weight="300"
        fill="#d1d5db"
        letter-spacing="0.5">
    Développeur de jeux &amp; créateur d'outils Unity
  </text>

  <!-- Tagline -->
  <text x="600" y="408" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, sans-serif"
        font-size="20" font-weight="400"
        fill="#9ca3af"
        letter-spacing="0.3">
    Expériences interactives · Tools Asset Store · Game design
  </text>

  <!-- Tag chips -->
  <g transform="translate(600, 480)">
    <!-- Unity chip -->
    <g transform="translate(-280, 0)">
      <rect x="0" y="0" width="130" height="44" rx="22" fill="rgba(192,132,252,0.12)" stroke="rgba(192,132,252,0.4)" stroke-width="1"/>
      <text x="65" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#e9d5ff">Unity / C#</text>
    </g>
    <!-- Games chip -->
    <g transform="translate(-130, 0)">
      <rect x="0" y="0" width="100" height="44" rx="22" fill="rgba(244,114,182,0.12)" stroke="rgba(244,114,182,0.4)" stroke-width="1"/>
      <text x="50" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#fbcfe8">Games</text>
    </g>
    <!-- Tools chip -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="90" height="44" rx="22" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.4)" stroke-width="1"/>
      <text x="45" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#ddd6fe">Tools</text>
    </g>
    <!-- Asset Store chip -->
    <g transform="translate(110, 0)">
      <rect x="0" y="0" width="170" height="44" rx="22" fill="rgba(192,132,252,0.12)" stroke="rgba(192,132,252,0.4)" stroke-width="1"/>
      <text x="85" y="28" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#e9d5ff">Asset Store Publisher</text>
    </g>
  </g>

  <!-- Bottom-right URL -->
  <text x="1120" y="585" text-anchor="end"
        font-family="Inter, system-ui, sans-serif"
        font-size="16" font-weight="400"
        fill="#6b7280"
        letter-spacing="0.5">
    www.gillijules.com
  </text>

  <!-- Top-right tools count -->
  <g transform="translate(1120, 100)">
    <text x="0" y="0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#9ca3af" letter-spacing="1">PORTFOLIO · 2026</text>
  </g>
</svg>
